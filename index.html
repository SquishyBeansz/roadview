<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RoadView">
<meta name="theme-color" content="#0b1220">
<title>RoadView Nav</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#0b1220; --panel:rgba(18,26,44,.94); --line:rgba(255,255,255,.08);
    --text:#eef2fb; --sub:#9aa7c2; --blue:#2f8cff; --green:#13865b; --red:#e5484d;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none}
  #map{position:fixed;inset:0}
  .hidden{display:none!important}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  /* search */
  #searchPanel{position:fixed;left:12px;right:12px;top:calc(var(--st) + 12px);z-index:5}
  .searchbox{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:16px;padding:0 8px 0 14px;
    height:54px;box-shadow:0 8px 30px rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .searchbox svg{flex:none;opacity:.7}
  #q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:17px;-webkit-user-select:text;user-select:text}
  #q::placeholder{color:var(--sub)}
  #clearQ{width:36px;height:36px;border-radius:50%;font-size:22px;color:var(--sub)}
  #results{margin-top:8px;background:var(--panel);border-radius:16px;overflow:hidden;max-height:60vh;overflow-y:auto;
    box-shadow:0 8px 30px rgba(0,0,0,.45)}
  #results:empty{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:7px;padding:12px}
  .chip{background:rgba(255,255,255,.08);border-radius:18px;padding:8px 12px;font-size:14px;font-weight:600}
  .chip:active{background:rgba(47,140,255,.35)}
  .sec{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;padding:6px 14px 4px;border-top:1px solid var(--line)}
  .res .dist{margin-left:auto;flex:none;font-size:13px;color:var(--sub);font-weight:600;padding-left:8px}
  .res{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
  .res:last-child{border-bottom:0}
  .res:active{background:rgba(255,255,255,.06)}
  .res .pin{flex:none;width:32px;height:32px;border-radius:50%;background:rgba(47,140,255,.15);display:grid;place-items:center}
  .res .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res .s{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res .m{min-width:0}
  .res.info{color:var(--sub);font-size:14px;justify-content:center}

  /* preview sheet */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-radius:22px 22px 0 0;
    padding:18px 18px calc(var(--sb) + 16px);box-shadow:0 -10px 40px rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .pv-name{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv-addr{font-size:14px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv-stats{display:flex;gap:14px;align-items:baseline;margin-top:14px}
  #pvTime{font-size:28px;font-weight:700;color:#4ade80}
  #pvDist{font-size:17px;color:var(--sub)}
  .pv-eta{font-size:14px;color:var(--sub);margin-top:2px}
  .row{display:flex;gap:10px;margin-top:16px}
  .btn{height:54px;border-radius:14px;font-size:18px;font-weight:700;flex:1}
  .btn.go{background:var(--blue);color:#fff;flex:2}
  .btn.ghost{background:rgba(255,255,255,.08)}
  .btn.end{background:var(--red);color:#fff;flex:none;width:86px;height:50px}
  .sim{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--sub)}
  .sim input{width:20px;height:20px;accent-color:var(--blue)}

  /* nav banner */
  #banner{position:fixed;left:10px;right:10px;top:calc(var(--st) + 10px);z-index:6;border-radius:18px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .b-main{display:flex;align-items:center;gap:14px;background:var(--green);padding:14px 16px}
  .b-icon{flex:none;width:58px;height:58px}
  .b-icon svg{width:100%;height:100%}
  .b-text{min-width:0}
  .b-dist{font-size:30px;font-weight:800;line-height:1}
  .b-dist small{font-size:18px;font-weight:700;margin-left:3px;opacity:.9}
  .b-instr{font-size:18px;font-weight:600;margin-top:5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .b-then{display:flex;align-items:center;gap:8px;background:#0c5d40;padding:7px 16px;font-size:15px;font-weight:600}
  .b-then svg{width:24px;height:24px}
  .b-main{transition:background .4s}
  #banner.close .b-main{background:#17a56f}
  #lanes{display:flex;justify-content:center;gap:5px;background:#0a4a33;padding:8px 10px;flex-wrap:nowrap;overflow:hidden}
  .lane{flex:0 1 46px;min-width:30px;height:50px;border-radius:9px;background:rgba(0,0,0,.25);display:grid;place-items:center;
    border:2px solid transparent;transition:background .3s,border-color .3s}
  .lane svg{width:34px;height:34px}
  .lane.ok{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4)}
  #lanes.now .lane.ok{background:#2f8cff;border-color:#fff;animation:lanePulse .9s ease-in-out infinite}
  #lanes.now .lane:not(.ok){opacity:.45}
  .modes{display:flex;background:rgba(255,255,255,.07);border-radius:12px;padding:3px;margin-top:14px}
  .modes button{flex:1;height:40px;border-radius:10px;font-weight:700;font-size:15px;color:var(--sub)}
  .modes button.on{background:var(--blue);color:#fff}
  #finder{position:fixed;left:50%;bottom:calc(var(--sb) + 110px);transform:translateX(-50%);z-index:6;width:min(92vw,360px);
    background:var(--panel);border-radius:22px;padding:16px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.55)}
  #fArrow{width:120px;height:120px;margin:0 auto;transition:transform .25s linear}
  #fDist{font-size:34px;font-weight:800;margin-top:6px}
  #fName{font-size:17px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #fTip{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.35}
  #walkOn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 100px);z-index:7;background:var(--blue);color:#fff;
    font-weight:800;font-size:17px;padding:15px 24px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  body.walk #speed{display:none!important}
  @keyframes lanePulse{50%{transform:scale(1.08);box-shadow:0 0 14px rgba(120,190,255,.9)}}

  #navBar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);display:flex;align-items:center;gap:10px;
    padding:12px 14px calc(var(--sb) + 12px) 18px;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
  .nb-left{flex:1;min-width:0}
  .nb-eta{font-size:24px;font-weight:800;color:#4ade80}
  .nb-sub{font-size:15px;color:var(--sub);margin-top:2px}
  .roundbtn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.08);font-size:22px;display:grid;place-items:center}

  #speed{position:fixed;left:14px;bottom:calc(var(--sb) + 100px);z-index:5;width:66px;height:66px;border-radius:50%;
    background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:11px;font-weight:700}
  #spVal{font-size:24px;font-weight:800;line-height:1}
  #recenter{position:fixed;right:14px;bottom:calc(var(--sb) + 104px);z-index:5;background:var(--panel);padding:13px 18px;
    border-radius:30px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.5);color:#7cb6ff}
  .modefab{bottom:calc(var(--sb) + 92px)!important;flex-direction:column;display:flex!important;align-items:center;justify-content:center;font-size:21px;line-height:1}
  .modefab small{font-size:10px;font-weight:700;color:var(--sub);margin-top:2px}
  body:not(.search) .modefab{display:none!important}
  .fab{position:fixed;right:14px;bottom:calc(var(--sb) + 28px);z-index:4;width:54px;height:54px;border-radius:50%;
    background:var(--panel);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  #status{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 150px);z-index:7;background:#f59e0b;color:#111;
    padding:9px 16px;border-radius:20px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  #toast{position:fixed;left:16px;right:16px;bottom:calc(var(--sb) + 110px);z-index:9;background:#1f2937;border:1px solid var(--line);
    padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center}
  #loading{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
  #loading .logo{font-size:30px;font-weight:800;letter-spacing:.5px}
  #loading .logo span{color:var(--blue)}
  #loading .sub{color:var(--sub);font-size:14px}

  .car{width:54px;height:54px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.55))}
  .destpin{width:34px;height:44px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}
  .maplibregl-ctrl-attrib{font-size:10px!important;opacity:.6}
  .maplibregl-ctrl-bottom-left{bottom:calc(var(--sb) + 2px)}
  body.nav .maplibregl-ctrl-bottom-left, body.preview .maplibregl-ctrl-bottom-left{display:none}
</style>
</head>
<body>
<div id="map"></div>

<div id="searchPanel">
  <div class="searchbox">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Where to?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button id="clearQ" class="hidden" aria-label="Clear">×</button>
  </div>
  <div id="results"></div>
</div>

<div id="preview" class="sheet hidden">
  <div class="pv-name" id="pvName"></div>
  <div class="pv-addr" id="pvAddr"></div>
  <div class="pv-stats"><span id="pvTime">–</span><span id="pvDist"></span></div>
  <div class="pv-eta" id="pvEta"></div>
  <div class="modes"><button id="mDrive" class="on">🚗 Drive</button><button id="mWalk">🚶 Walk</button></div>
  <div class="row">
    <button id="cancelBtn" class="btn ghost">Cancel</button>
    <button id="driveBtn" class="btn go">Drive</button>
  </div>
  <label class="sim"><input type="checkbox" id="simChk"> Test drive (simulated — try it from your couch)</label>
</div>

<div id="banner" class="hidden">
  <div class="b-main">
    <div id="bIcon" class="b-icon"></div>
    <div class="b-text"><div id="bDist" class="b-dist"></div><div id="bInstr" class="b-instr"></div></div>
  </div>
  <div id="bThen" class="b-then hidden"></div>
  <div id="lanes" class="hidden"></div>
</div>

<div id="navBar" class="hidden">
  <div class="nb-left"><div id="nbEta" class="nb-eta"></div><div id="nbSub" class="nb-sub"></div></div>
  <button id="modeNav" class="roundbtn" aria-label="Switch car or walking">🚶</button>
  <button id="muteBtn" class="roundbtn" aria-label="Voice">🔊</button>
  <button id="endBtn" class="btn end">End</button>
</div>

<div id="speed" class="hidden"><div id="spVal">0</div><div>MPH</div></div>
<button id="recenter" class="hidden">⦿ Re-center</button>
<button id="modeFab" class="fab modefab" aria-label="Car or walking"><span id="modeIco">🚗</span><small id="modeTxt">Car</small></button>
<button id="locBtn" class="fab" aria-label="My location">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="#2f8cff"><path d="M21 3L3 10.5l7.5 2.9L13.4 21z"/></svg>
</button>
<div id="finder" class="hidden">
  <div id="fArrow"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="rgba(47,140,255,.12)" stroke="rgba(47,140,255,.5)" stroke-width="2"/><path d="M50 10 L74 72 L50 60 L26 72 Z" fill="#2f8cff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg></div>
  <div id="fDist"></div>
  <div id="fName"></div>
  <div id="fTip">Hold your phone flat and follow the arrow. GPS is less accurate indoors — look for signs and the store directory too.</div>
</div>
<button id="walkOn" class="hidden">🚶 Walk the rest</button>
<div id="status" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="loading"><div class="logo">Road<span>View</span></div><div class="sub">Loading map…</div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ---------- Map style: simple dark "satnav" look from OpenFreeMap vector tiles ---------- */
const NAME = ['coalesce', ['get', 'name:en'], ['get', 'name']];
const isLine = ['match', ['geometry-type'], ['LineString', 'MultiLineString'], true, false];
function road(id, classes, color, w, extra) {
  return Object.assign({
    id, type: 'line', source: 'omt', 'source-layer': 'transportation',
    filter: ['all', isLine, ['match', ['get', 'class'], classes, true, false]],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': color,
      'line-width': ['interpolate', ['exponential', 1.7], ['zoom'], 8, w[0], 12, w[1], 16, w[2], 19, w[3]] }
  }, extra || {});
}
const STYLE = {
  version: 8,
  glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sources: { omt: { type: 'vector', url: 'https://tiles.openfreemap.org/planet',
    attribution: '© OpenStreetMap contributors · OpenFreeMap · OSRM' } },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#0e1626' } },
    { id: 'landuse', type: 'fill', source: 'omt', 'source-layer': 'landuse',
      filter: ['match', ['get', 'class'], ['residential', 'suburb', 'neighbourhood'], true, false],
      paint: { 'fill-color': '#111c30' } },
    { id: 'park', type: 'fill', source: 'omt', 'source-layer': 'park', paint: { 'fill-color': '#12291f' } },
    { id: 'landcover', type: 'fill', source: 'omt', 'source-layer': 'landcover',
      filter: ['match', ['get', 'class'], ['wood', 'grass'], true, false],
      paint: { 'fill-color': '#112419', 'fill-opacity': 0.8 } },
    { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-color': '#132a4a' } },
    road('road-path', ['path'], '#3b4a6b', [0, 0.4, 2, 5], { minzoom: 15,
      paint: { 'line-color': '#4a5b80', 'line-dasharray': [1.5, 1.2],
        'line-width': ['interpolate', ['linear'], ['zoom'], 15, 1, 19, 4] } }),
    road('road-service', ['service', 'track'], '#1f2940', [0.3, 0.8, 5, 12], { minzoom: 13 }),
    road('road-minor', ['minor'], '#2a3652', [0.4, 1.2, 9, 22]),
    road('road-mid', ['secondary', 'tertiary'], '#384664', [0.7, 2, 13, 30]),
    road('road-major', ['primary', 'trunk'], '#46557a', [1, 2.8, 16, 36]),
    road('road-motorway', ['motorway'], '#5b6b93', [1.2, 3.4, 20, 44]),
    road('road-center', ['primary', 'trunk', 'secondary', 'motorway'], '#c9a227', [0, 0.3, 1.2, 2.4],
      { minzoom: 15, paint: { 'line-color': '#c9a227', 'line-dasharray': [3, 3],
        'line-width': ['interpolate', ['linear'], ['zoom'], 15, 0.6, 19, 2.4] } }),
    { id: 'building-3d', type: 'fill-extrusion', source: 'omt', 'source-layer': 'building', minzoom: 14,
      paint: { 'fill-extrusion-color': '#223050',
        'fill-extrusion-height': ['*', 0.8, ['coalesce', ['get', 'render_height'], 6]],
        'fill-extrusion-base': ['*', 0.8, ['coalesce', ['get', 'render_min_height'], 0]],
        'fill-extrusion-opacity': 0.85 } },
    { id: 'road-label', type: 'symbol', source: 'omt', 'source-layer': 'transportation_name', minzoom: 13,
      layout: { 'symbol-placement': 'line', 'text-field': NAME, 'text-font': ['Noto Sans Regular'],
        'text-size': ['interpolate', ['linear'], ['zoom'], 13, 11, 18, 15], 'text-max-angle': 30 },
      paint: { 'text-color': '#cfd8ea', 'text-halo-color': '#0e1626', 'text-halo-width': 1.6 } },
    { id: 'poi-label', type: 'symbol', source: 'omt', 'source-layer': 'poi', minzoom: 16.5,
      filter: ['has', 'name'],
      layout: { 'text-field': NAME, 'text-font': ['Noto Sans Regular'], 'text-size': 12, 'text-max-width': 8,
        'text-anchor': 'top', 'text-offset': [0, 0.4] },
      paint: { 'text-color': ['match', ['get', 'class'], ['shop', 'clothing_store', 'grocery'], '#ffd38a', ['restaurant', 'fast_food', 'cafe'], '#ffa9a9', '#b9c7e3'],
        'text-halo-color': '#0e1626', 'text-halo-width': 1.6 } },
    { id: 'place-label', type: 'symbol', source: 'omt', 'source-layer': 'place',
      filter: ['match', ['get', 'class'], ['city', 'town', 'village', 'state'], true, false],
      layout: { 'text-field': NAME, 'text-font': ['Noto Sans Bold'],
        'text-size': ['match', ['get', 'class'], 'city', 16, 'state', 13, 13], 'text-transform': 'none' },
      paint: { 'text-color': '#e7ecf7', 'text-halo-color': '#0e1626', 'text-halo-width': 2 } }
  ]
};

/* ---------- State ---------- */
let map, carMarker, destMarker;
let gps = null, watchId = null, firstFix = true;
let mode = 'search';            // search | preview | nav
let R = null, dest = null;      // prepared route, destination
let following = true, lastHeading = 0, lastAlong = 0, lastSnapSeg = 0;
let offCount = 0, lastReroute = 0, rerouting = false, arrived = false;
let sim = null, wakeLock = null, muted = false, announced = {};
let searchTimer = null, searchSeq = 0;
let travel = 'drive', compass = null;
window.addEventListener('deviceorientation', e => {
  if (e.webkitCompassHeading != null) compass = e.webkitCompassHeading;
  else if (e.absolute && e.alpha != null) compass = (360 - e.alpha) % 360;
}, true);
async function askCompass() {
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
}

/* ---------- Helpers ---------- */
const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
function hav(a, b) {
  const dLat = toRad(b[1] - a[1]), dLon = toRad(b[0] - a[0]);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(s));
}
function bearing(a, b) {
  const y = Math.sin(toRad(b[0] - a[0])) * Math.cos(toRad(b[1]));
  const x = Math.cos(toRad(a[1])) * Math.sin(toRad(b[1])) - Math.sin(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.cos(toRad(b[0] - a[0]));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
function smoothAngle(from, to, k) {
  let d = ((to - from + 540) % 360) - 180;
  return (from + d * k + 360) % 360;
}
function fmtDist(m) {
  const ft = m * 3.28084, mi = m / 1609.34;
  if (ft < 1000) return { v: ft < 100 ? Math.max(10, Math.round(ft / 10) * 10) : Math.round(ft / 50) * 50, u: 'ft' };
  return { v: mi < 10 ? mi.toFixed(1) : Math.round(mi), u: 'mi' };
}
function spokenDist(m) {
  const d = fmtDist(m);
  if (d.u === 'ft') return d.v + ' feet';
  if (d.v === '0.5') return 'half a mile';
  if (d.v === '1.0') return '1 mile';
  return d.v + ' miles';
}
function fmtDur(s) {
  const m = Math.max(1, Math.round(s / 60));
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' hr' + (r ? ' ' + r + ' min' : '');
}
const clock = s => new Date(Date.now() + s * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
let toastT;
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), ms || 3500);
}

  if (!q) { renderHome(); return; }
  if (q.length < 2) return;
  searchTimer = setTimeout(() => runSearch(q), 450);
});
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault(); clearTimeout(searchTimer);
    const l = $('results')._list;
    if (l && l.length) { saveRecent(l[0]); pickDest(l[0]); } else if ($('q').value.trim()) runSearch($('q').value);
  }
});
$('clearQ').onclick = () => { $('q').value = ''; $('clearQ').classList.add('hidden'); renderHome(); $('q').focus(); };
document.addEventListener('touchstart', e => {
    if (mode === 'search' && !$('searchPanel').contains(e.target) && !$('q').value.trim()) renderResults(null);
}, { passive: true });

/* ---------- Routing (OSRM) ---------- */
async function getRoute(from, to, heading) {
  const pts = `${from[0]},${from[1]};${to[0]},${to[1]}?overview=full&geometries=geojson&steps=true`;
  let url = travel === 'walk'
    ? `https://routing.openstreetmap.de/routed-foot/route/v1/driving/${pts}`
    : `https://router.project-osrm.org/route/v1/driving/${pts}`;
  if (travel === 'drive' && heading != null && !isNaN(heading)) url += `&bearings=${Math.round(heading) % 360},60;`;
  let j;
  try { const r = await fetch(url); j = await r.json(); if (j.code !== 'Ok') throw 0; }
  catch (e) {
    if (travel !== 'walk') throw e;
    const r2 = await fetch(`https://router.project-osrm.org/route/v1/driving/${pts}`);
    j = await r2.json();
    if (j.routes) j.routes.forEach(rt => { rt.duration = rt.distance / 1.35; rt.legs.forEach(l => l.steps.forEach(st => st.duration = st.distance / 1.35)); });
  }
  if (j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error(j.message || 'No route');
  return j.routes[0];
}
function prepare(rt) {
  const c = rt.geometry.coordinates;
  const cum = [0];
  for (let i = 1; i < c.length; i++) cum.push(cum[i - 1] + hav(c[i - 1], c[i]));
  const steps = rt.legs[0].steps, starts = [];
  let idx = 0;
  for (const s of steps) { starts.push(cum[Math.min(idx, c.length - 1)]); idx += Math.max(0, s.geometry.coordinates.length - 1); }
  return { c, cum, total: cum[cum.length - 1], steps, starts, duration: rt.duration, distance: rt.distance };
}
function setRoute(rt) {
  R = prepare(rt);
  lastSnapSeg = 0; lastAlong = 0; announced = {}; laneKey = ''; turnKey = '';
  map.getSource('route').setData({ type: 'Feature', geometry: rt.geometry });
}
function snap(lon, lat) {
  const c = R.c, n = c.length, kx = 111320 * Math.cos(toRad(lat)), ky = 110540;
  const test = (a, b) => {
    let best = null;
    for (let i = a; i < b; i++) {
      const ax = (c[i][0] - lon) * kx, ay = (c[i][1] - lat) * ky;
      const dx = (c[i + 1][0] - c[i][0]) * kx, dy = (c[i + 1][1] - c[i][1]) * ky, L2 = dx * dx + dy * dy;
      let t = L2 ? -(ax * dx + ay * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(ax + t * dx, ay + t * dy);
      if (!best || d < best.d) best = { i, t, d };
    }
    return best;
  };
  let b = test(Math.max(0, lastSnapSeg - 5), Math.min(n - 1, lastSnapSeg + 400));
  if (!b || b.d > 60) { const f = test(0, n - 1); if (f && (!b || f.d < b.d)) b = f; }
  lastSnapSeg = b.i;
  const i = b.i;
  const pt = [c[i][0] + (c[i + 1][0] - c[i][0]) * b.t, c[i][1] + (c[i + 1][1] - c[i][1]) * b.t];
  return { i, d: b.d, along: R.cum[i] + (R.cum[i + 1] - R.cum[i]) * b.t, pt, bearing: bearing(c[i], c[i + 1]) };
}
function pointAt(d) {
  const cum = R.cum, c = R.c;
  let lo = 0, hi = cum.length - 1;
  if (d >= R.total) return { pt: c[c.length - 1], bearing: bearing(c[c.length - 2], c[c.length - 1]) };
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
  const seg = cum[hi] - cum[lo] || 1, t = (d - cum[lo]) / seg;
  return { pt: [c[lo][0] + (c[hi][0] - c[lo][0]) * t, c[lo][1] + (c[hi][1] - c[lo][1]) * t], bearing: bearing(c[lo], c[hi]) };
}
function stepAt(d) { let k = 0; for (let i = 0; i < R.starts.length; i++) if (R.starts[i] <= d) k = i; return k; }

/* ---------- Flow: pick → preview → drive ---------- */
async function pickDest(place, fromLL) {
  $('q').blur();
  renderResults(null);
  dest = place;
  const from = fromLL || (gps ? [gps.lon, gps.lat] : null);
  if (!from) { toast('Waiting for your GPS location… (allow Location for this site)'); return; }
  setMode('preview');
  $('pvName').textContent = place.name; $('pvAddr').textContent = place.addr || '';
  $('pvTime').textContent = 'Finding route…'; $('pvDist').textContent = ''; $('pvEta').textContent = '';
  $('driveBtn').disabled = true;
  $('driveBtn').textContent = travel === 'walk' ? 'Walk' : 'Drive';
  $('mDrive').classList.toggle('on', travel === 'drive'); $('mWalk').classList.toggle('on', travel === 'walk');
  destMarker.setLngLat(place.ll).addTo(map);
  try {
    const rt = await getRoute(from, place.ll);
    setRoute(rt);
    $('pvTime').textContent = fmtDur(rt.duration);
    const d = fmtDist(rt.distance); $('pvDist').textContent = d.v + ' ' + d.u;
    $('pvEta').textContent = 'Arrive around ' + clock(rt.duration) + (travel === 'walk' ? ' · walking' : '');
    $('driveBtn').disabled = false;
    const b = new maplibregl.LngLatBounds();
    rt.geometry.coordinates.forEach(p => b.extend(p));
    map.fitBounds(b, { padding: { top: 90, bottom: 300, left: 50, right: 50 }, pitch: 0, bearing: 0, duration: 900, maxZoom: 16 });
  } catch (e) {
    $('pvTime').textContent = 'No route found';
    $('pvEta').textContent = 'Try a different destination.';
  }
}

function setMode(m) {
  mode = m;
  document.body.className = m;
  $('searchPanel').classList.toggle('hidden', m !== 'search');
  $('preview').classList.toggle('hidden', m !== 'preview');
  $('banner').classList.toggle('hidden', m !== 'nav');
  $('navBar').classList.toggle('hidden', m !== 'nav');
  $('speed').classList.toggle('hidden', m !== 'nav');
  $('locBtn').classList.toggle('hidden', m !== 'search');
  $('recenter').classList.add('hidden');
}

$('cancelBtn').onclick = () => endTrip();
function syncModeUI() {
  const w = travel === 'walk';
  $('modeIco').textContent = w ? '🚶' : '🚗'; $('modeTxt').textContent = w ? 'Walk' : 'Car';
  $('modeNav').textContent = w ? '🚗' : '🚶';
  $('mDrive').classList.toggle('on', !w); $('mWalk').classList.toggle('on', w);
}
$('modeFab').onclick = () => {
  travel = travel === 'walk' ? 'drive' : 'walk';
  if (travel === 'walk') askCompass();
  syncModeUI();
  toast(travel === 'walk' ? '🚶 Walking mode — routes use footpaths' : '🚗 Driving mode', 1800);
};
$('modeNav').onclick = async () => {
  if (!dest || rerouting) return;
  const wasSim = !!sim; stopSim();
  travel = travel === 'walk' ? 'drive' : 'walk';
  if (travel === 'walk') askCompass();
  syncModeUI();
  document.body.classList.toggle('walk', travel === 'walk');
  walkLook(travel === 'walk');
  $('walkOn').classList.add('hidden'); $('finder').classList.add('hidden');
  const ll = carMarker._map ? carMarker.getLngLat() : null;
  const from = ll ? [ll.lng, ll.lat] : (gps ? [gps.lon, gps.lat] : null);
  if (!from) return;
  rerouting = true; status(travel === 'walk' ? 'Switching to walking…' : 'Switching to driving…');
  try {
    setRoute(await getRoute(from, dest.ll));
    arrived = false; offCount = 0; finderAnnounced = false; following = true;
    say((travel === 'walk' ? 'Walking directions. ' : 'Driving directions. ') + instr(R.steps[0]));
    if (wasSim || $('simChk').checked) startSim(); else if (gps) navUpdate(gps);
  } catch (e) { toast('Could not get a ' + (travel === 'walk' ? 'walking' : 'driving') + ' route'); }
  finally { rerouting = false; status(null); }
};
$('mDrive').onclick = () => { if (travel !== 'drive' && dest) { travel = 'drive'; syncModeUI(); pickDest(dest); } };
$('mWalk').onclick = () => { askCompass(); if (travel !== 'walk' && dest) { travel = 'walk'; syncModeUI(); pickDest(dest); } };
$('walkOn').onclick = async () => {
  $('walkOn').classList.add('hidden');
  const place = dest; travel = 'walk'; syncModeUI();
  const ll = carMarker.getLngLat();
  await pickDest(place, [ll.lng, ll.lat]);
  if (R) $('driveBtn').onclick();
};
function walkLook(on) {
  try {
    map.setPaintProperty('building-3d', 'fill-extrusion-opacity', on ? 0.35 : 0.85);
    map.setPaintProperty('route-line', 'line-dasharray', on ? [1, 1.4] : undefined);
    map.setPaintProperty('route-line', 'line-color', on ? '#5fb0ff' : '#3d9bff');
  } catch (e) {}
}
$('driveBtn').onclick = () => {
  if (!R) return;
  if (travel === 'walk') askCompass();
  walkLook(travel === 'walk');
  unlockVoice();
  requestWake();
  setMode('nav');
  document.body.classList.toggle('walk', travel === 'walk');
  arrived = false; following = true; offCount = 0; finderAnnounced = false;
  const first = R.steps[0];
  lastHeading = first && first.maneuver ? first.maneuver.bearing_after || 0 : 0;
  const start = gps ? [gps.lon, gps.lat] : R.c[0];
  map.jumpTo({ center: start, zoom: travel === 'walk' ? 18.6 : 17.3, pitch: travel === 'walk' ? 50 : 62, bearing: lastHeading });
  setTimeout(() => say('Starting route. ' + instr(R.steps[0]) + (R.steps[1] ? '. Then ' + instr(R.steps[1]) : '')), 300);
  if ($('simChk').checked) startSim();
  else if (gps) navUpdate(gps);
};
$('endBtn').onclick = () => endTrip();
$('muteBtn').onclick = () => { muted = !muted; $('muteBtn').textContent = muted ? '🔇' : '🔊'; if (muted) try { speechSynthesis.cancel(); } catch (e) {} };
$('recenter').onclick = () => { following = true; $('recenter').classList.add('hidden'); if (gps) navUpdate(gps); };
$('locBtn').onclick = () => {
  if (gps) map.flyTo({ center: [gps.lon, gps.lat], zoom: 16, pitch: 50, duration: 900 });
  else toast('No GPS yet — allow Location for this site in Safari.');
};

function endTrip() {
  stopSim();
  R = null; dest = null; arrived = false;
  walkLook(false); syncModeUI();
  $('finder').classList.add('hidden'); $('walkOn').classList.add('hidden');
  const empty = { type: 'FeatureCollection', features: [] };
  ['route', 'turn', 'turnhead'].forEach(s => map.getSource(s) && map.getSource(s).setData(empty));
  $('lanes').classList.add('hidden'); $('banner').classList.remove('close'); laneKey = ''; turnKey = '';
  destMarker.remove();
  releaseWake();
  try { speechSynthesis.cancel(); } catch (e) {}
  status(null);
  setMode('search');
  if (gps) map.easeTo({ center: [gps.lon, gps.lat], zoom: 16, pitch: 50, bearing: 0, duration: 800 });
}

/* ---------- Navigation core ---------- */
function speedZoom(v) {
  const mph = (v || 0) * 2.237;
  if (mph < 20) return 17.6;
  if (mph < 40) return 17.1;
  if (mph < 58) return 16.5;
  return 15.9;
}
function navUpdate(f) {
  if (!R || arrived) return;
  const s = snap(f.lon, f.lat);
  const walk = travel === 'walk';
  const tol = walk ? Math.max(25, Math.min(f.acc || 0, 60)) : Math.max(35, Math.min(f.acc || 0, 80));
  const on = s.d < tol;
  offCount = on ? 0 : offCount + 1;
  const toDest = hav([f.lon, f.lat], dest.ll);
  if (offCount >= (walk ? 6 : 3) && !rerouting && !sim && Date.now() - lastReroute > (walk ? 20000 : 8000) && !(walk && toDest < 150)) reroute(f);

  let h;
  if (walk && compass != null && !f.sim) h = compass;
  else if ((f.speed || 0) > 2.5 && f.heading != null && !isNaN(f.heading)) h = f.heading;
  else if (on) h = s.bearing;
  else h = lastHeading;
  lastHeading = smoothAngle(lastHeading, h, f.sim ? 0.35 : 0.7);

  const pos = on ? s.pt : [f.lon, f.lat];
  if (on) lastAlong = s.along;
  const along = lastAlong;
  const remain = Math.max(0, R.total - along);

  // arrival
  if (walk) {
    if (toDest < 8 || (on && remain < 4)) { arrive(pos); return; }
    updateFinder(f, toDest, remain < 150 || toDest < 120);
  } else if ((on && remain < 25) || toDest < 25) { arrive(pos); return; }

  // next maneuver
  let k = R.steps.length - 1;
  for (let i = 1; i < R.steps.length; i++) if (R.starts[i] > along + 2) { k = i; break; }
  const step = R.steps[k], dTurn = Math.max(0, R.starts[k] - along);
  const d = fmtDist(dTurn);
  $('bIcon').innerHTML = arrowSVG(step);
  $('bDist').innerHTML = d.v + '<small>' + d.u + '</small>';
  $('bInstr').textContent = instr(step);
  const nxt = R.steps[k + 1];
  if (nxt && step.maneuver.type !== 'arrive' && (R.starts[k + 1] - R.starts[k]) < 250) {
    $('bThen').innerHTML = 'Then ' + arrowSVG(nxt);
    $('bThen').classList.remove('hidden');
  } else $('bThen').classList.add('hidden');

  // trip info
  const tLeft = R.duration * (remain / (R.total || 1));
  $('nbEta').textContent = clock(tLeft);
  const rd = fmtDist(remain);
  $('nbSub').textContent = fmtDur(tLeft) + ' · ' + rd.v + ' ' + rd.u;
  $('spVal').textContent = Math.round((f.speed || 0) * 2.237);

  // voice
  const sp = Math.max(f.speed || 0, walk ? 1.4 : 9);
  const far = walk ? 60 : Math.max(400, sp * 35), near = walk ? 15 : Math.max(90, sp * 9);
  renderLanes(k, dTurn, far, near);
  renderTurnArrow(k, dTurn, far);
  const a = announced[k] || (announced[k] = {});
  if (dTurn <= far && dTurn > near * 1.6 && !a.far) {
    a.far = 1;
    const hint = laneHint(lanesFor(k));
    say('In ' + spokenDist(dTurn) + ', ' + instr(step) + (hint ? '. ' + hint : ''));
  }
  if (dTurn <= near && !a.near) { a.near = a.far = 1; say(instr(step) + (nxt && (R.starts[k + 1] - R.starts[k]) < 250 ? ', then ' + instr(nxt) : '')); }

  // car + remaining route line
  carMarker.setLngLat(pos).setRotation(lastHeading);
  if (!carMarker._map) carMarker.addTo(map);
  if (on) map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [pos].concat(R.c.slice(s.i + 1)) } });

  // camera
  if (following) {
    map.easeTo({ center: pos, bearing: lastHeading, pitch: walk ? 50 : 62, zoom: walk ? 18.6 : speedZoom(f.speed),
      duration: f.sim ? 260 : 950, easing: t => t, offset: [0, map.getContainer().clientHeight * 0.2] });
  }
}
let finderAnnounced = false;
function updateFinder(f, toDest, show) {
  const box = $('finder');
  if (!show) { box.classList.add('hidden'); return; }
  if (box.classList.contains('hidden')) {
    box.classList.remove('hidden');
    if (!finderAnnounced) { finderAnnounced = true; say((dest.name || 'Your destination') + ' is ' + spokenDist(toDest) + ' away. Follow the arrow.'); }
  }
  const brg = bearing([f.lon, f.lat], dest.ll);
  const head = compass != null && !f.sim ? compass : lastHeading;
  $('fArrow').style.transform = 'rotate(' + Math.round(((brg - head) + 360) % 360) + 'deg)';
  const d = fmtDist(toDest);
  $('fDist').textContent = d.v + ' ' + d.u;
  $('fName').textContent = dest.name || '';
}
async function reroute(f) {
  rerouting = true; lastReroute = Date.now();
  status('Rerouting…'); say('Rerouting');
  try { setRoute(await getRoute([f.lon, f.lat], dest.ll, f.heading)); offCount = 0; }
  catch (e) { toast('Could not reroute — will try again'); }
  finally { rerouting = false; status(null); }
}
function arrive(pos) {
  arrived = true;
  stopSim();
  $('finder').classList.add('hidden');
  if (travel === 'drive' && dest) $('walkOn').classList.remove('hidden');
  carMarker.setLngLat(pos);
  $('bIcon').innerHTML = arrowSVG(null);
  $('bDist').innerHTML = 'Arrived';
  $('bInstr').textContent = dest ? dest.name : 'You have arrived';
  $('bThen').classList.add('hidden');
  $('nbEta').textContent = 'You’re here';
  $('nbSub').textContent = 'Tap End to finish';
  say('You have arrived at your destination');
  const empty = { type: 'FeatureCollection', features: [] };
  ['route', 'turn', 'turnhead'].forEach(s => map.getSource(s).setData(empty));
  $('lanes').classList.add('hidden'); $('banner').classList.remove('close'); laneKey = 'x'; turnKey = 'x';
}

/* ---------- Simulated test drive ---------- */
function startSim() {
  stopSim();
  let d = 0;
  sim = setInterval(() => {
    if (!R) return stopSim();
    const st = R.steps[stepAt(d)];
    let v = st && st.duration > 0 ? st.distance / st.duration : 13;
    v = travel === 'walk' ? 1.4 : Math.min(Math.max(v, 7), 31);
    d += v * 0.25 * (travel === 'walk' ? 4 : 1.5);
    const p = pointAt(d);
    navUpdate({ lon: p.pt[0], lat: p.pt[1], speed: v, heading: p.bearing, acc: 5, sim: true });
  }, 250);
}
function stopSim() { if (sim) { clearInterval(sim); sim = null; } }

/* ---------- GPS ---------- */
function startGPS() {
  if (!('geolocation' in navigator)) { toast('This browser has no GPS access.'); return; }
  watchId = navigator.geolocation.watchPosition(p => {
    const c = p.coords;
    gps = { lon: c.longitude, lat: c.latitude, speed: c.speed, heading: c.heading, acc: c.accuracy };
    if (sim) return;
    if (mode === 'nav') navUpdate(gps);
    else {
      carMarker.setLngLat([gps.lon, gps.lat]);
      if (gps.heading != null && !isNaN(gps.heading) && gps.speed > 1) carMarker.setRotation(gps.heading);
      if (!carMarker._map) carMarker.addTo(map);
      if (firstFix && mode === 'search') { firstFix = false; map.flyTo({ center: [gps.lon, gps.lat], zoom: 16, pitch: 50, duration: 1500 }); }
    }
  }, err => {
    if (err.code === 1) toast('Location is blocked. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using. Then reload.', 9000);
    else toast('Waiting for GPS signal…');
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}

/* ---------- Keep screen on ---------- */
async function requestWake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && mode === 'nav') requestWake(); });

/* ---------- Init ---------- */
function carEl() {
  const el = document.createElement('div');
  el.innerHTML = `<svg class="car" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="rgba(47,140,255,.18)"/><path d="M27 7 L42 44 L27 36 L12 44 Z" fill="#2f8cff" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/></svg>`;
  return el.firstChild;
}
function pinEl() {
  const el = document.createElement('div');
  el.innerHTML = `<svg class="destpin" viewBox="0 0 34 44"><path d="M17 43S2 27.5 2 17a15 15 0 0 1 30 0c0 10.5-15 26-15 26z" fill="#e5484d" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="17" r="5.5" fill="#fff"/></svg>`;
  return el.firstChild;
}
function init() {
  if (!window.maplibregl) { document.querySelector('#loading .sub').textContent = 'Could not load the map — check your connection and reload.'; return; }
  map = new maplibregl.Map({
    container: 'map', style: STYLE, center: [-98.5, 39.8], zoom: 3.6, pitch: 0,
    attributionControl: false, maxPitch: 70, dragRotate: true, pitchWithRotate: true
  });
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');
  carMarker = new maplibregl.Marker({ element: carEl(), rotationAlignment: 'map', pitchAlignment: 'map' });
  destMarker = new maplibregl.Marker({ element: pinEl(), anchor: 'bottom' });

  map.on('load', () => {
    map.addSource('route', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({ id: 'route-casing', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#0b3a86', 'line-width': ['interpolate', ['exponential', 1.6], ['zoom'], 8, 6, 14, 12, 18, 34] } }, 'building-3d');
    map.addLayer({ id: 'route-line', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#3d9bff', 'line-width': ['interpolate', ['exponential', 1.6], ['zoom'], 8, 3.5, 14, 8, 18, 24] } }, 'building-3d');
    addTurnLayers();
    const L = $('loading'); L.style.opacity = 0; setTimeout(() => L.remove(), 450);
  });
  const userMove = e => { if (e.originalEvent && mode === 'nav') { following = false; $('recenter').classList.remove('hidden'); } };
  map.on('dragstart', userMove); map.on('zoomstart', userMove); map.on('rotatestart', userMove); map.on('pitchstart', userMove);

  setMode('search');
  startGPS();
}
init();
})();
